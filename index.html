
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack | Task Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevTrack</h1>
        <p>Your personal development dashboard</p>
    </header>

    <main class="container">

        <section class="stats">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Remaining</h3>
                <p id="remainingTasks">0</p>
            </div>
        </section>

        <section class="task-section">
            <h2>My Tasks</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    required
                >

                <button type="submit">Add Task</button>
            </form>

            <ul id="taskList"></ul>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
